name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # מוודא שה־HTML שבריפו מתאים ל־data/*.json
      - name: build
        run: node scripts/build.mjs

      - name: fail if generated HTML is stale
        run: |
          if ! git diff --quiet -- index.html study/index.html; then
            echo "::error::index.html / study/index.html אינם מעודכנים. הריצו: node scripts/build.mjs וקמטו מחדש."
            git --no-pager diff --stat -- index.html study/index.html
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
