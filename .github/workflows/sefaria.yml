name: refresh sefaria commentary

on:
  schedule:
    - cron: '17 4 1 * *'   # אחת לחודש
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: fetch from sefaria
        run: node scripts/fetch-sefaria.mjs --verbose

      - name: rebuild pages
        run: node scripts/build.mjs

      - name: commit if changed
        run: |
          if git diff --quiet; then
            echo "אין שינוי."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commentary.json index.html study/index.html
          git commit -m "data: רענון פירושי ספריא"
          git push
