<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Assistant';font-weight:400;font-display:block;
  src:url(../assets/fonts/assistant-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:400;font-display:block;
  src:url(../assets/fonts/assistant-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Assistant';font-weight:500;font-display:block;
  src:url(../assets/fonts/assistant-hebrew-500-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:600;font-display:block;
  src:url(../assets/fonts/assistant-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Assistant',sans-serif;
  background:
    radial-gradient(120% 90% at 50% 0%, #FFFDF9 0%, #FAF9F6 55%, #F4F2EC 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#16181B;position:relative;overflow:hidden}

/* קו דק בשוליים, כמו המסגרת של כרטיס באתר */
.frame{position:absolute;inset:26px;border:1px solid #E7E3DA;border-radius:22px}

.kicker{font-size:21px;font-weight:600;letter-spacing:.18em;color:#9A7639;margin-bottom:52px}

/* הפסוק שממנו הכל התחיל */
.verse{font-size:84px;font-weight:600;color:#16181B;line-height:1.5;letter-spacing:-.01em}

.rule{width:132px;height:1px;background:#D6D0C4;margin:54px 0 46px}

.title{font-size:40px;font-weight:600;color:#3B6675;letter-spacing:-.005em}
.sub{font-size:26px;font-weight:400;color:#878E98;margin-top:14px}
</style></head>
<body>
  <div class="frame"></div>
  <p class="kicker">לשון חכמים · חלק ב, סימן טז</p>
  <p class="verse">אֵ־ל נָא רְפָא נָא לָהּ</p>
  <div class="rule"></div>
  <p class="title">סגולת הקל וחומר</p>
  <p class="sub">לימוד ותפילה לרפואה</p>
</body></html>
